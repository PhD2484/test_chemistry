<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по химии</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
  .container { background: #fff; max-width: 650px; width: 100%; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); align-self: center; }
  h1 { font-size: 22px; margin: 0 0 4px; color: #1a1a2e; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: #888; margin-bottom: 12px; background: #f8f9fa; padding: 10px; border-radius: 8px; }
  .timer { color: #dc3545; }
  .question { font-size: 17px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; color: #1a1a2e; }
  
  /* Стили для обычных вопросов */
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .option { padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer; font-size: 15px; line-height: 1.4; transition: all 0.15s; display: flex; align-items: flex-start; gap: 10px; }
  .option:hover { border-color: #4a90d9; background: #f5f9ff; }
  .option.selected { border-color: #4a90d9; background: #e8f2ff; }
  .option input { margin-top: 2px; accent-color: #4a90d9; }

  /* Стили для вопросов на соответствие */
  .match-container { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
  .match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .match-item { padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; text-align: center; cursor: pointer; font-weight: 500; transition: all 0.15s; background: #fafafa; font-size: 14px; display: flex; flex-direction: column; justify-content: center; min-height: 50px; }
  .match-item.active { border-color: #4a90d9; background: #e8f2ff; }
  .match-item.paired { border-color: #28a745; background: #e8f5e9; }
  .match-item small { display: block; font-weight: normal; font-size: 12px; color: #666; margin-top: 4px; }

  .btn { width: 100%; padding: 14px; background: #4a90d9; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .btn:hover { background: #3a7bc8; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .result { text-align: center; padding: 20px 0; }
  .result h2 { font-size: 28px; margin: 0 0 8px; }
  .result p { color: #666; margin: 0 0 20px; }
  .summary { text-align: left; background: #f8f9fa; border-radius: 12px; padding: 16px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
  .summary .ok { color: #28a745; font-weight: 600; }
  .summary .fail { color: #dc3545; font-weight: 600; }
  .hidden { display: none; }
  input[type="text"] { width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; margin-bottom: 16px; }
  input[type="text"]:focus { outline: none; border-color: #4a90d9; }
</style>
</head>
<body>

<div class="container">
  <div id="screen-name">
    <h1>Тест по химии</h1>
    <p class="subtitle">5 случайных вопросов. Введите фамилию, чтобы начать.</p>
    <input type="text" id="lastname" placeholder="Ваша фамилия" maxlength="50">
    <button class="btn" id="start-btn">Начать тест</button>
  </div>

  <div id="screen-quiz" class="hidden">
    <div class="progress-row">
      <span id="progress"></span>
      <span class="timer" id="timer-display">⏳ 45 сек.</span>
    </div>
    <div class="question" id="question-text"></div>
    
    <div id="options-container" class="options"></div>

    <div id="match-container" class="match-container hidden">
      <div class="match-col" id="match-left"></div>
      <div class="match-col" id="match-right"></div>
    </div>

    <button class="btn" id="answer-btn" disabled>Ответить</button>
  </div>

  <div id="screen-result" class="hidden">
    <div class="result">
      <h2 id="result-title"></h2>
      <p id="result-score"></p>
    </div>
    <div class="summary" id="summary"></div>
    <button class="btn" id="finish-btn">Завершить тестирование</button>
  </div>
</div>

<script>
// ==========================================
// НАСТРОЙКА ВРЕМЕНИ НА ВЕСЬ ТЕСТ (в секундах)
// ==========================================
const TOTAL_TIME_LIMIT = 45; 

// Ваша ссылка на Google Apps Script
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhuClMqT755pQWvOs-keEV9NPrxP-xmxceaD3vClo9GFn0mUS_FOQANxRXXy8iN8o/exec';

const ALL_QUESTIONS = [
  // 1
  { type: 'single', q: 'Из спортивной физиологии известно, что ионы натрия (Na+) и калия (K+) играют ключевую роль в возникновении потенциала действия. Они находятся в I группе Периодической системы, поэтому имеют одинаковое строение внешнего электронного слоя. По такому же принципу микроэлемент мышьяк (As), который в следовых количествах обнаруживается в тканях организма, будет иметь сходное строение внешнего электронного слоя с элементом:', options: ['фосфора', 'селена', 'германия', 'ванадия'], correct: 0, solution: 'Мышьяк (As) находится в V группе, как и фосфор (P). Они имеют одинаковое число электронов на внешнем слое (5).' },

  // 2 (вопрос с обоснованием, адаптирован в тест)
  { type: 'single', q: 'В ряду элементов второго периода Периодической системы химических элементов Ве → В → С → N происходит:', options: ['увеличение радиуса атомов', 'увеличение силы притяжения валентных электронов к ядру', 'уменьшение электроотрицательности', 'уменьшение числа валентных электронов'], correct: 1, solution: 'В ряду Ве → В → С → N заряд ядра растёт, радиус атома падает, притяжение валентных электронов к ядру увеличивается.' },

  // 3 (задание на соответствие)
  { 
    type: 'match', 
    q: 'Установите соответствие между названием химического соединения и видом химической связи:', 
    left: ['1. цинк', '2. азот (N2)', '3. аммиак (NH3)', '4. хлорид кальция'], 
    right: ['А. ионная', 'Б. металлическая', 'В. ковалентная полярная', 'Г. ковалентная неполярная'], 
    correctMap: {0: 1, 1: 3, 2: 2, 3: 0},
    solution: '1-Б (металлическая), 2-Г (ковалентная неполярная), 3-В (ковалентная полярная), 4-А (ионная).'
  },

  // 4 (выбор нескольких ответов, адаптирован)
  { type: 'single', q: 'Восстановление мышц спортсмена после тренировки связано с транспортом ионов. Ионная химическая связь характерна для солей. Выберите соединение, в котором присутствует ионная связь:', options: ['Ca(ClO2)2', 'HClO3', 'HClO4', 'Cl2O7'], correct: 0, solution: 'Ca(ClO2)2 — это соль (перхлорат кальция), состоящая из катиона Ca2+ и анионов ClO2-, связь между ними ионная. Остальные — кислоты и оксиды с ковалентными связями.' },

  // 5
  { type: 'single', q: 'В спортивной химии катализаторы применяют для ускорения различных промышленных процессов. На смещение химического равновесия в системе N2 + 3H2 ⇄ 2NH3 + Q не оказывает влияния:', options: ['понижение температуры', 'повышение давления', 'удаление аммиака из зоны реакции', 'применение катализатора'], correct: 3, solution: 'Катализатор ускоряет и прямую, и обратную реакцию, но не смещает химическое равновесие.' },

  // 6
  { type: 'single', q: 'В организме спортсмена постоянно идут реакции ионного обмена, например, нейтрализация молочной кислоты бикарбонатами крови. К реакциям ионного обмена можно отнести реакции между:', options: ['натрием и водой', 'железом и серой', 'магнием и соляной кислотой', 'растворами хлорида бария и сульфата натрия'], correct: 3, solution: 'Реакция между растворами хлорида бария и сульфата натрия — это реакция обмена ионами с образованием осадка (BaSO4).' },

  // 7 (задание на соответствие)
  { 
    type: 'match', 
    q: 'Установите соответствие между уравнением окислительно-восстановительной реакции и веществом-окислителем:', 
    left: ['1. H2S + I2 = S + 2HI', '2. 2S + C = CS2', '3. 2SO3 + 2KI = I2 + SO2 + K2SO4', '4. S + 3NO2 = SO3 + 3NO'], 
    right: ['А. HNO2', 'Б. H2S', 'В. HI', 'Г. S', 'Д. SO3', 'Е. I2'], 
    correctMap: {0: 5, 1: 3, 2: 4, 3: 0},
    solution: '1-Е (I2), 2-Г (S), 3-Д (SO3), 4-А (HNO2).'
  },

  // 8 (вопрос с обоснованием, адаптирован)
  { type: 'single', q: 'Рассчитайте молярную массу (М) углекислого газа (CO2) с известными атомными массами: C=12, O=16.', options: ['28 г/моль', '32 г/моль', '44 г/моль', '48 г/моль'], correct: 2, solution: 'M = Ar(C) + 2 × Ar(O) = 12 + 2 × 16 = 12 + 32 = 44 г/моль.' },

  // 9
  { type: 'single', q: 'Спортивные диетологи учитывают, что углеводороды (например, алканы) входят в состав жиров. Состав алканов можно выразить общей формулой:', options: ['CnH2n', 'CnH2n+2', 'CnH2n-2', 'CnH2n-6'], correct: 1, solution: 'Общая формула алканов — CnH2n+2.' },

  // 10 (задание на соответствие)
  { 
    type: 'match', 
    q: 'Установите соответствие между формулой органического вещества и классом/группой, к которому оно относится:', 
    left: ['1. CH3-O-CH3', '2. CH3-CH2-OH', '3. CH3COOH', '4. C6H6'], 
    right: ['А. Алканы', 'Б. Алкены', 'В. Спирты', 'Г. Карбоновые кислоты', 'Д. Простые эфиры', 'Е. Арены'], 
    correctMap: {0: 4, 1: 2, 2: 3, 3: 5},
    solution: '1-Д (простой эфир), 2-В (спирт), 3-Г (карбоновая кислота), 4-Е (арен).'
  },

  // 11 (задание на соответствие)
  { 
    type: 'match', 
    q: 'Установите соответствие между типом гибридизации атома углерода и геометрической формой молекулы:', 
    left: ['1. sp3', '2. sp2', '3. sp'], 
    right: ['А. линейная', 'Б. плоский треугольник', 'В. тетраэдр (угловая)', 'Г. квадрат'], 
    correctMap: {0: 2, 1: 1, 2: 0},
    solution: '1-В (sp3 — тетраэдр), 2-Б (sp2 — плоский треугольник), 3-А (sp — линейная).'
  },

  // 12
  { type: 'single', q: 'Для экспресс-диагностики нарушений углеводного обмена у спортсменов используют анализ мочи на глюкозу. Глюкоза - это альдегидоспирт, поэтому для ее обнаружения можно использовать качественную реакцию на альдегидную группу. Реактивом для качественного определения альдегидов является:', options: ['аммиачный раствор оксида серебра(I)', 'спиртовой раствор йода', 'бромная вода', 'раствор перманганата калия'], correct: 0, solution: 'Реакция «серебряного зеркала» (аммиачный раствор оксида серебра) — качественная реакция на альдегидную группу.' },

  // 14 (задание с обоснованием, адаптирован)
  { type: 'single', q: 'В цикле Кребса участвуют лимонная, яблочная и другие кислоты. Все они содержат карбоксильную группу. Функциональная группа –СООН характерна для класса веществ:', options: ['спиртов', 'альдегидов', 'карбоновых кислот', 'аминов'], correct: 2, solution: 'Соединения, содержащие группу атомов -СООН, относятся к классу карбоновых кислот.' },

  // 15 (задание с обоснованием, адаптирован)
  { type: 'single', q: 'В спортивной медицине для получения охлаждающих спреев используют алканы (метан, этан, пропан). Они отличаются друг от друга на группу CH2, то есть являются гомологами. Гомологом метана (СН4) является:', options: ['этан (С2Н6)', 'этен (С2Н4)', 'ацетилен (С2Н2)', 'метанол (СН3ОН)'], correct: 0, solution: 'Гомологи — вещества одного класса, отличающиеся на группу -CH2-. Этан (C2H6) отличается от метана (CH4) на группу CH2.' },

  // 16 (открытый вопрос, адаптирован)
  { type: 'single', q: 'Для профилактики травм и восстановления спортсменам рекомендуют сбалансированное питание, включающее белки. Приведите пример функции белков в организме спортсмена с точки зрения химии.', options: ['Белки являются основным источником быстрой энергии для мышц', 'Белки (например, гемоглобин) переносят кислород к работающим мышцам и участвуют в построении тканей', 'Белки служат главным компонентом клеточных мембран', 'Белки являются катализаторами расщепления жиров'], correct: 1, solution: 'Белки выполняют транспортную функцию (гемоглобин переносит кислород), структурную (строительный материал) и могут служить источником энергии при длительных нагрузках.' },

  // 17 (открытый вопрос, адаптирован)
  { type: 'single', q: 'Современные футбольные и баскетбольные мячи изготавливают из синтетического каучука. Приведите примеры использования каучука в спортивном инвентаре (кроме мячей).', options: ['Шины для велосипедов и амортизирующие покрытия беговых дорожек', 'Стекловолокно для шестов и легкоатлетических копий', 'Металлические сплавы для гантелей и штанг', 'Ткани для спортивной формы'], correct: 0, solution: 'Каучук используется для производства шин, амортизирующих покрытий, ручек ракеток, уплотнителей в очках для плавания и т.д.' }
];

let currentQuestions = [];
let currentIndex = 0;
let answers = [];
let lastname = '';
let timerInterval = null;
let timeLeft = 0;

let currentMatch = {}; 
let activeLeft = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const screenName = document.getElementById('screen-name');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');

document.getElementById('start-btn').addEventListener('click', () => {
  const input = document.getElementById('lastname');
  lastname = input.value.trim();
  if (!lastname) { alert('Введите фамилию'); return; }
  startQuiz();
});

function startQuiz() {
  const singleQuestions = ALL_QUESTIONS.filter(q => q.type === 'single');
  const matchQuestions = ALL_QUESTIONS.filter(q => q.type === 'match');
  
  currentQuestions = [
    ...shuffle(singleQuestions).slice(0, 3),
    ...shuffle(matchQuestions).slice(0, 2)
  ];
  currentQuestions = shuffle(currentQuestions);

  currentIndex = 0;
  answers = [];
  
  screenName.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  screenResult.classList.add('hidden');

  timeLeft = TOTAL_TIME_LIMIT;
  document.getElementById('timer-display').textContent = `⏳ ${timeLeft} сек.`;
  
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer-display').textContent = `⏳ ${timeLeft} сек.`;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      finishQuiz();
    }
  }, 1000);

  showQuestion();
}

function showQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById('progress').textContent = `Вопрос ${currentIndex + 1} из 5`;
  document.getElementById('question-text').innerHTML = q.q;

  const optionsContainer = document.getElementById('options-container');
  const matchContainer = document.getElementById('match-container');
  const answerBtn = document.getElementById('answer-btn');

  optionsContainer.innerHTML = '';
  document.getElementById('match-left').innerHTML = '';
  document.getElementById('match-right').innerHTML = '';
  currentMatch = {};
  activeLeft = null;

  if (q.type === 'single') {
    optionsContainer.classList.remove('hidden');
    matchContainer.classList.add('hidden');
    answerBtn.disabled = true;

    q.options.forEach((opt, i) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.innerHTML = `<input type="radio" name="q${currentIndex}" value="${i}"><span>${opt}</span>`;
      label.addEventListener('click', () => {
        document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
        label.classList.add('selected');
        answerBtn.disabled = false;
      });
      optionsContainer.appendChild(label);
    });
  } else if (q.type === 'match') {
    optionsContainer.classList.add('hidden');
    matchContainer.classList.remove('hidden');
    answerBtn.disabled = true;

    const leftCol = document.getElementById('match-left');
    const rightCol = document.getElementById('match-right');

    q.left.forEach((text, i) => {
      const div = document.createElement('div');
      div.className = 'match-item';
      div.innerHTML = `${text} <small id="pair-for-${i}"></small>`;
      div.dataset.index = i;
      div.dataset.side = 'left';
      div.addEventListener('click', () => handleMatchClick(div, q));
      leftCol.appendChild(div);
    });

    q.right.forEach((text, i) => {
      const div = document.createElement('div');
      div.className = 'match-item';
      div.innerHTML = `<span style="font-weight:bold">${text.substring(0,2)}</span> ${text.substring(3)}`;
      div.dataset.index = i;
      div.dataset.side = 'right';
      div.addEventListener('click', () => handleMatchClick(div, q));
      rightCol.appendChild(div);
    });
  }

  answerBtn.textContent = currentIndex === 4 ? 'Завершить тест' : 'Ответить';
  answerBtn.onclick = () => answerQuestion();
}

function handleMatchClick(div, q) {
  const side = div.dataset.side;
  const idx = parseInt(div.dataset.index);

  if (side === 'left') {
    document.querySelectorAll('#match-left .match-item').forEach(el => el.classList.remove('active'));
    div.classList.add('active');
    activeLeft = idx;
  } else if (side === 'right') {
    if (activeLeft === null) return;

    if (currentMatch[activeLeft] !== undefined) {
      const oldRight = currentMatch[activeLeft];
      document.querySelectorAll(`#match-right .match-item[data-index="${oldRight}"]`).forEach(el => el.classList.remove('paired'));
      document.getElementById(`pair-for-${activeLeft}`).textContent = '';
    }

    currentMatch[activeLeft] = idx;
    
    document.querySelectorAll(`#match-left .match-item[data-index="${activeLeft}"]`).forEach(el => el.classList.remove('active'));
    document.querySelectorAll(`#match-right .match-item[data-index="${idx}"]`).forEach(el => {
      el.classList.add('paired');
    });
    document.getElementById(`pair-for-${activeLeft}`).textContent = `➔ ${q.right[idx].substring(0, 2)}`;
    
    activeLeft = null;

    if (Object.keys(currentMatch).length === q.left.length) {
      document.getElementById('answer-btn').disabled = false;
    }
  }
}

function answerQuestion() {
  const q = currentQuestions[currentIndex];
  let isCorrect = false;
  let chosenText = '';
  let correctText = '';

  if (q.type === 'single') {
    const selected = document.querySelector(`input[name="q${currentIndex}"]:checked`);
    if (!selected) return;
    const chosen = parseInt(selected.value);
    isCorrect = (chosen === q.correct);
    chosenText = q.options[chosen];
    correctText = q.options[q.correct];
  } else if (q.type === 'match') {
    isCorrect = true;
    let userPairs = [];
    let correctPairs = [];

    for (let i = 0; i < q.left.length; i++) {
      const userRight = currentMatch[i];
      const correctRight = q.correctMap[i];
      
      const userLetter = q.right[userRight].substring(0, 2);
      const correctLetter = q.right[correctRight].substring(0, 2);

      userPairs.push(`${i+1}-${userLetter.replace('.', '')}`);
      correctPairs.push(`${i+1}-${correctLetter.replace('.', '')}`);

      if (userRight !== correctRight) isCorrect = false;
    }
    chosenText = userPairs.join(', ');
    correctText = correctPairs.join(', ');
  }

  answers.push({
    question: q.q,
    chosenText: chosenText,
    correctText: correctText,
    isCorrect: isCorrect,
    solution: q.solution
  });

  currentIndex++;

  if (currentIndex < 5 && timeLeft > 0) {
    showQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  if (timerInterval) clearInterval(timerInterval);
  screenQuiz.classList.add('hidden');
  screenResult.classList.remove('hidden');

  while (answers.length < 5) {
    const q = currentQuestions[answers.length];
    answers.push({
      question: q.q,
      chosenText: 'Нет ответа (время вышло)',
      correctText: q.type === 'single' ? q.options[q.correct] : 'Сопоставление не выполнено',
      isCorrect: false,
      solution: q.solution || 'Решение отсутствует.'
    });
  }

  const correctCount = answers.filter(a => a.isCorrect).length;
  
  document.getElementById('result-title').textContent = correctCount === 5 ? 'Отлично!' : 'Тест завершён';
  document.getElementById('result-score').textContent = `Правильных ответов: ${correctCount} из 5`;

  let summaryHtml = '<strong>Разбор ответов:</strong><br><br>';
  answers.forEach((a, i) => {
    summaryHtml += `<div style="margin-bottom:12px;">`;
    summaryHtml += `<strong>${i + 1}. ${a.question}</strong><br>`;
    summaryHtml += `Ваш ответ: <span class="${a.isCorrect ? 'ok' : 'fail'}">${a.chosenText}</span><br>`;
    if (!a.isCorrect) {
      summaryHtml += `Правильный: <span class="ok">${a.correctText}</span><br>`;
    }
    summaryHtml += `<span style="color:#666;font-size:13px;">${a.solution}</span>`;
    summaryHtml += `</div>`;
  });
  document.getElementById('summary').innerHTML = summaryHtml;

  sendToSheet(correctCount);
}

function sendToSheet(correctCount) {
  const params = new URLSearchParams();
  params.append('Фамилия', lastname);
  params.append('Итог', `${correctCount}/5`);
  params.append('Предмет', 'Химия'); // Добавили поле, чтобы отличать от физики в таблице

  answers.forEach((a, i) => {
    params.append(`Вопрос${i + 1}`, a.question.substring(0, 50) + '...');
    params.append(`Ответ${i + 1}`, a.chosenText);
    params.append(`Верно${i + 1}`, a.isCorrect ? 'Да' : 'Нет');
  });

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: params.toString()
  }).catch(() => {});
}

document.getElementById('finish-btn').addEventListener('click', () => {
  document.querySelector('.container').innerHTML = `
    <div style="text-align: center; padding: 40px 0;">
      <h2 style="color: #28a745; margin-bottom: 10px;">Спасибо!</h2>
      <p style="color: #666;">Результаты успешно отправлены.<br>Вы можете закрыть эту страницу.</p>
    </div>
  `;
});
</script>
